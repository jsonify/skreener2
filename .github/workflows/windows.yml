name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-neutral logic (Skreener.Core) builds and tests on Linux, so this job is quick.
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Core (warnings are errors)
        run: dotnet test windows/tests/Skreener.Core.Tests

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/src/Skreener.App/Skreener.App.csproj -p:Platform=${{ matrix.platform }}
      - name: Build app (warnings are errors)
        run: dotnet build windows/src/Skreener.App/Skreener.App.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore -o windows/artifacts/${{ matrix.platform }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Skreener-windows-${{ matrix.platform }}
          path: windows/artifacts/${{ matrix.platform }}
