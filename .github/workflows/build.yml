name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths-ignore:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all commits and tags: build_app.sh takes the version and build number from them
      # Use the newest Xcode on the runner: newer compilers add warnings the default one doesn't report.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Versioned bundles only: the plain Xcode.app is the runner's default, which sorts last.
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests (warnings are errors)
        run: swift test -Xswiftc -warnings-as-errors
      # SkreenerCore is shared with the iOS Share Extension (#396), so it must keep building for iOS.
      - name: Compile SkreenerCore for iOS (warnings are errors)
        run: xcodebuild build -scheme SkreenerCore -destination 'generic/platform=iOS' OTHER_SWIFT_FLAGS='-warnings-as-errors'
      - name: Build Universal app (warnings are errors)
        run: ./Scripts/build_app.sh
        env:
          SKREENER_STRICT: "1"
          SKREENER_UNIVERSAL: "1"   # as releases are, so the Intel build is compile-checked too
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Skreener.app
          path: build/Skreener.app
