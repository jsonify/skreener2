name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build app
        run: ./Scripts/build_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Skreener.app
          path: build/Skreener.app
