name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Use the newest Xcode on the runner: newer compilers add warnings the default one doesn't report.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build app (warnings are errors)
        run: ./Scripts/build_app.sh
        env:
          SKREENER_STRICT: "1"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Skreener.app
          path: build/Skreener.app
