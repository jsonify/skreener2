name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build app
        run: ./Scripts/build_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Skreener.app
          path: build/Skreener.app
