name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'Sources/SkreenerCore/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'Sources/SkreenerCore/**'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A newer run for the same branch replaces any older one still queued or running.
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Use the newest Xcode on the runner: newer compilers add warnings the default one doesn't report.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Versioned bundles only: the plain Xcode.app is the runner's default, which sorts last.
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: cd ios && xcodegen generate
      # Warnings are errors through the project's build settings (project.yml).
      - name: Build for the iOS Simulator
        run: |
          cd ios
          xcodebuild build -project Skreener.xcodeproj -scheme Skreener \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      # xcodegen generate ran stamp_build_number.sh (project.yml's preGenCommand): the built app and extensions must
      # carry its number and project.yml's MARKETING_VERSION, which App Store Connect reads from their Info.plists.
      - name: Check the version and build number
        run: |
          cd ios
          want_build=$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' BuildNumber.xcconfig)
          want_version=$(sed -n 's/^ *MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml)
          echo "Want: $want_version ($want_build)"
          test -n "$want_build"
          test -n "$want_version"
          app=build/Build/Products/Debug-iphonesimulator/Skreener.app
          for plist in "$app/Info.plist" "$app/PlugIns/SkreenerShare.appex/Info.plist" \
              "$app/PlugIns/SkreenerBroadcast.appex/Info.plist" "$app/PlugIns/SkreenerControls.appex/Info.plist"; do
            build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
            echo "$plist: $version ($build)"
            test "$build" = "$want_build"
            test "$version" = "$want_version"
          done
