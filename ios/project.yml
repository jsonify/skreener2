# XcodeGen spec for the iOS Share Extension (#396). Run `xcodegen generate` in this folder; the .xcodeproj is not committed.
name: Skreener

options:
  bundleIdPrefix: com.skreener
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Stamps the build number (CURRENT_PROJECT_VERSION) into BuildNumber.xcconfig on every generate.
  preGenCommand: sh stamp_build_number.sh

# Signing.xcconfig optionally includes the gitignored Local.xcconfig, where the owner sets DEVELOPMENT_TEAM once, and
# BuildNumber.xcconfig, which stamp_build_number.sh writes on every generate.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"            # same language mode as the root package
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    MARKETING_VERSION: "0.1.0"
    # CURRENT_PROJECT_VERSION comes from BuildNumber.xcconfig through Signing.xcconfig: a setting here would override it.
    CODE_SIGN_STYLE: Automatic

packages:
  SkreenerCore:
    path: ..
  SK1Kit:
    url: https://github.com/jsonify/SK1Kit.git
    from: 0.3.0

targets:
  Skreener:
    type: application
    platform: iOS
    sources:
      - path: Skreener
        excludes:
          - PrivacyInfo.xcprivacy
      # The privacy manifest (UserDefaults, for "last sent to the background") is a resource, copied into the app.
      - path: Skreener/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: SkreenerShare       # embedded in the app
      - target: SkreenerEditor      # embedded in the app's Frameworks, where the extension finds it at runtime
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skreener.ios
        PRODUCT_NAME: Skreener
        # Skreener/Assets.xcassets/AppIcon.appiconset, drawn by Scripts/make_icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Skreener/Info.plist
      properties:
        CFBundleDisplayName: Skreener
        # XcodeGen writes 1.0 and 1 otherwise, whatever the build settings say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Read access: asked on the first tap of Show my screenshots or Latest screenshot, never at launch.
        NSPhotoLibraryUsageDescription: Skreener shows your recent screenshots so you can edit them.
        NSPhotoLibraryAddUsageDescription: Skreener saves your edited screenshot to Photos.
        # The home screen has a Select more key for limited access, so iOS needn't ask on each launch.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # All four: Xcode warns otherwise ("All interface orientations must be supported...").
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SkreenerShare:
    type: app-extension
    platform: iOS
    sources:
      - SkreenerShare
    dependencies:
      - target: SkreenerEditor
        embed: false                # the app embeds it
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skreener.ios.share
        PRODUCT_NAME: SkreenerShare
        # Not an app: only extension-safe APIs.
        APPLICATION_EXTENSION_API_ONLY: YES
        # The appex finds the framework in the app's Frameworks folder.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: SkreenerShare/Info.plist
      properties:
        CFBundleDisplayName: Skreener
        # XcodeGen writes 1.0 and 1 otherwise, whatever the build settings say.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: Skreener saves your edited screenshot to Photos.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1

  # The editor (the Share Extension's screens, drawing and export), as a framework so the app can use it too (#408).
  # The extension links it without embedding; the app embeds it. Xcode generates its Info.plist (no gitignored file
  # to add) from the same MARKETING_VERSION and CURRENT_PROJECT_VERSION as the app's, as App Store Connect requires.
  SkreenerEditor:
    type: framework
    platform: iOS
    sources:
      - SkreenerEditor
    dependencies:
      - package: SkreenerCore
        product: SkreenerCore
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skreener.ios.editor
        PRODUCT_NAME: SkreenerEditor
        # The extension links it, so only extension-safe APIs.
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Skreener:
    build:
      targets:
        Skreener: all
        SkreenerShare: all
        SkreenerEditor: all
    run:
      config: Debug
    archive:
      config: Release
